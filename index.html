<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Ticket Prioritizer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="container">
        <header class="header">
            <h1>AI Support Ticket Prioritizer</h1>
            <p class="subtitle">Automatically classify and prioritize support tickets with AI</p>
        </header>

        <main class="main-content">
            <div class="input-section">
                <div class="form-group">
                    <label for="message">Support Message</label>
                    <textarea 
                        id="message" 
                        placeholder="Enter the support ticket message here..."
                        rows="6"
                        required
                    ></textarea>
                </div>
                <button id="processBtn" class="process-btn">
                    <span class="btn-text">Process Ticket</span>
                    <span class="btn-loading" style="display: none;">Processing...</span>
                </button>
            </div>

            <div id="results" class="results-section" style="display: none;">
                <h2>Analysis Results</h2>
                
                <div class="result-grid">
                    <div class="result-item">
                        <label>Category</label>
                        <div id="categoryBadge" class="badge category-badge"></div>
                    </div>
                    
                    <div class="result-item">
                        <label>Priority</label>
                        <div id="priorityBadge" class="badge priority-badge"></div>
                    </div>
                </div>

                <div class="reply-section">
                    <label>AI-Generated Reply</label>
                    <div id="aiReply" class="reply-box"></div>
                </div>

                <button id="resetBtn" class="reset-btn">Process Another Ticket</button>
            </div>

            <div id="error" class="error-message" style="display: none;"></div>
        </main>

        <footer class="footer">
            <p>Powered by AI • Built with Node.js & Express</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
